<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#0f172a"/>
  
  <!-- Film reel circles -->
  <circle cx="30" cy="50" r="8" fill="none" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="30" cy="50" r="5" fill="#e0e7ff"/>
  
  <circle cx="70" cy="50" r="8" fill="none" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="70" cy="50" r="5" fill="#e0e7ff"/>
  
  <!-- Film strip center -->
  <rect x="38" y="42" width="24" height="16" fill="none" stroke="#a78bfa" stroke-width="2" rx="2"/>
  
  <!-- Film frames -->
  <rect x="40" y="44" width="4" height="4" fill="#a78bfa"/>
  <rect x="46" y="44" width="4" height="4" fill="#a78bfa"/>
  <rect x="52" y="44" width="4" height="4" fill="#a78bfa"/>
  
  <rect x="40" y="52" width="4" height="4" fill="#a78bfa"/>
  <rect x="46" y="52" width="4" height="4" fill="#a78bfa"/>
  <rect x="52" y="52" width="4" height="4" fill="#a78bfa"/>
  
  <!-- Play button overlay -->
  <polygon points="50,55 50,45 62,50" fill="#60a5fa" opacity="0.8"/>
</svg>